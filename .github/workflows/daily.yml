name: Than Akat daily report
on:
  workflow_dispatch:
    inputs:
      send_line:
        description: 'Send this report to personal LINE after deployment'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *' # 07:00 Asia/Bangkok, subject to Actions queue delays
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: than-akat-daily
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Load prepared report system
        run: |
          test -f than-akat-system.zip
          test -f cleanrooms-weekly.json
          unzip -o than-akat-system.zip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Preserve published report archives
        shell: bash
        run: |
          mkdir -p public
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            git archive origin/gh-pages | tar -x -C public
          fi
      - name: Install renderer (RSU fonts are embedded)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Tests
        run: npm test
      - name: Download Air4Thai (cleanrooms use weekly register)
        shell: pwsh
        run: |
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow,'Asia/Bangkok').ToString('yyyy-MM-dd',[cultureinfo]::InvariantCulture)
          ./system/fetch.ps1 -Date $date -AirOnly
      - name: Build and render report
        run: |
          node system/build.mjs
          node system/render.mjs
      - name: Report metadata
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("public/report.json","utf8"));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"Report: "+r.date+" | issue "+r.publication.label+"\n\nCleanroom register updated: "+r.rooms.sourceDate+"; valid records today: "+r.rooms.total.rooms+". No cleanroom API request was made by this daily job.\n");'
      - name: Save public archive branch
        shell: bash
        run: |
          cd public
          git init -b gh-pages
          git config user.name 'than-akat-report'
          git config user.email 'report@users.noreply.github.com'
          git add .
          git commit -m 'Publish daily report archive'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf .git
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy public reports
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send personal LINE
        if: github.event_name == 'schedule' || inputs.send_line
        run: node system/send.mjs
        env:
          REPORT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
