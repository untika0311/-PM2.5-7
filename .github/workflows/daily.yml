name: Than Akat daily report
on:
  workflow_dispatch:
    inputs:
      send_line:
        description: 'Send report to personal LINE and approved workgroup'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['than-akat-system.zip', 'cleanrooms-weekly.json', '.github/workflows/daily.yml']
  schedule:
    - cron: '17 20,22,23 * * *' # Prepare at 03:17, 05:17, 06:17 Bangkok; wait on runner for 07:05
    - cron: '7,27,47 0 * * *' # Backup requests at 07:07, 07:27, 07:47 Bangkok
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: than-akat-daily
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 330 # Keep a prepared runner alive until the 07:00 data cutoff
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Load prepared report system
        run: |
          test -f than-akat-system.zip
          test -f cleanrooms-weekly.json
          unzip -o than-akat-system.zip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Preserve published report archives
        shell: bash
        run: |
          mkdir -p public
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            git archive origin/gh-pages | tar -x -C public
          fi
      - name: Check accepted LINE delivery for today
        id: due
        run: node system/check-delivery.mjs
        env:
          SEND_LINE: ${{ inputs.send_line }}
          LINE_GROUP_ID: ${{ vars.LINE_GROUP_ID }}
      - name: Install renderer (RSU fonts are embedded)
        if: steps.due.outputs.run_report == 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Tests
        if: steps.due.outputs.run_report == 'true'
        run: npm test
      - name: Wait on prepared runner for 07.05 Bangkok
        if: steps.due.outputs.run_report == 'true'
        shell: python
        run: |
          import datetime, time
          tz = datetime.timezone(datetime.timedelta(hours=7))
          now = datetime.datetime.now(tz)
          target = now.replace(hour=7, minute=5, second=0, microsecond=0)
          while datetime.datetime.now(tz) < target:
              seconds = (target - datetime.datetime.now(tz)).total_seconds()
              print('Prepared runner waiting for 07:05 Bangkok; remaining %.0f minutes' % (seconds / 60), flush=True)
              time.sleep(min(60, max(0, seconds)))
          print('Collect only observations ending at 07:00 Bangkok', flush=True)
      - name: Download Air4Thai (cleanrooms use weekly register)
        if: steps.due.outputs.run_report == 'true'
        shell: pwsh
        run: |
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow,'Asia/Bangkok').ToString('yyyy-MM-dd',[cultureinfo]::InvariantCulture)
          ./system/fetch.ps1 -Date $date -AirOnly
      - name: Build and render report
        if: steps.due.outputs.run_report == 'true'
        run: |
          node system/build.mjs
          node system/render.mjs
      - name: Report metadata
        if: steps.due.outputs.run_report == 'true'
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("public/report.json","utf8"));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"Report: "+r.date+" | issue "+r.publication.label+"\n\nCleanroom register updated: "+r.rooms.sourceDate+"; valid records today: "+r.rooms.total.rooms+". No cleanroom API request was made by this daily job.\n");'
      - name: Save public archive branch
        if: steps.due.outputs.run_report == 'true'
        shell: bash
        run: |
          cd public
          git init -b gh-pages
          git config user.name 'than-akat-report'
          git config user.email 'report@users.noreply.github.com'
          git add .
          git commit -m 'Publish daily report archive'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf .git
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
        if: steps.due.outputs.run_report == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.run_report == 'true'
        with:
          path: public
      - name: Deploy public reports
        if: steps.due.outputs.run_report == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send LINE to approved destinations
        id: line_send
        if: steps.due.outputs.run_report == 'true' && steps.due.outputs.send_line == 'true'
        run: node system/send.mjs
        env:
          REPORT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID: ${{ vars.LINE_GROUP_ID }}
      - name: Preserve accepted LINE receipt for automatic retries
        if: always() && steps.due.outputs.run_report == 'true' && steps.due.outputs.send_line == 'true' && steps.line_send.outcome != 'skipped' && hashFiles('public/line-delivery-state.json') != ''
        shell: bash
        run: |
          test -f public/line-delivery-state.json
          cd public
          git init -b gh-pages
          git config user.name 'than-akat-report'
          git config user.email 'report@users.noreply.github.com'
          git add .
          git commit -m 'Record accepted LINE delivery'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf .git
        env:
          GH_TOKEN: ${{ github.token }}

